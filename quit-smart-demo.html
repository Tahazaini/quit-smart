<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuitSmart - 21-Day Smoking Reduction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="app"></div>

    <script>
        // ============= DATA & UTILITIES =============
        const TRIGGERS = ['stress', 'coffee', 'after_meal', 'boredom', 'waiting'];
        
        const ALTERNATIVES = {
            stress: [
                { action: "Take 10 deep breaths (4 in, 6 out)", duration: "2 min" },
                { action: "Do 20 jumping jacks or push-ups", duration: "3 min" },
                { action: "Step outside for fresh air", duration: "5 min" },
                { action: "Listen to a calming song", duration: "4 min" }
            ],
            coffee: [
                { action: "Switch to herbal tea or water", duration: "Instant" },
                { action: "Chew sugar-free gum", duration: "5 min" },
                { action: "Take a short walk with your coffee", duration: "5 min" },
                { action: "Do a quick stretch routine", duration: "3 min" }
            ],
            after_meal: [
                { action: "Brush your teeth immediately", duration: "2 min" },
                { action: "Eat a piece of fruit or mint", duration: "3 min" },
                { action: "Take a 5-minute walk", duration: "5 min" },
                { action: "Call someone to chat", duration: "5 min" }
            ],
            boredom: [
                { action: "Play a quick mobile game", duration: "5 min" },
                { action: "Read an article or book chapter", duration: "10 min" },
                { action: "Organize one small area", duration: "5 min" },
                { action: "Watch a funny video", duration: "3 min" }
            ],
            waiting: [
                { action: "Browse social media mindfully", duration: "5 min" },
                { action: "Listen to a podcast snippet", duration: "5 min" },
                { action: "Do breathing exercises", duration: "3 min" },
                { action: "Plan your next meal or activity", duration: "3 min" }
            ]
        };

        const TIPS = [
            "Start slow. Track without judgment.",
            "Replace one smoke with a walk.",
            "Drink water before reaching for a cigarette.",
            "Deep breathing: 4 in, 6 out.",
            "Chew gum when cravings hit.",
            "Call a friend instead of smoking.",
            "Do 10 jumping jacks.",
            "Delay each cigarette by 10 minutes.",
            "Avoid your usual smoking spot.",
            "Celebrate: You're 1/3 done!",
            "Write down why you're quitting.",
            "Try a new route to avoid triggers.",
            "Reward yourself.",
            "Cravings pass in 3-5 minutes.",
            "Halfway there!",
            "Replace evening smoke with tea.",
            "Clean your space of cigarettes.",
            "Visualize yourself as a non-smoker.",
            "Plan smoke-free activities.",
            "One day left!",
            "Final day: Reflect on progress!"
        ];

        function generatePlan(baseline) {
            const plan = [];
            for (let day = 1; day <= 21; day++) {
                const factor = 0.3 + 0.7 * Math.pow((21 - day) / 21, 1.5);
                const target = Math.max(1, Math.round(baseline * factor));
                plan.push({ day, target, tip: TIPS[day - 1] });
            }
            return plan;
        }

        function getTodayString() {
            return new Date().toISOString().split('T')[0];
        }

        function getDayNumber(startDate) {
            const start = new Date(startDate);
            const today = new Date();
            const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24));
            return Math.min(Math.max(diff + 1, 1), 21);
        }

        function getLabel(trigger) {
            return trigger.replace('_', ' ').split(' ').map(w => 
                w.charAt(0).toUpperCase() + w.slice(1)
            ).join(' ');
        }

        function getTriggerEmoji(trigger) {
            const emojis = {
                stress: '😰',
                coffee: '☕',
                after_meal: '🍽️',
                boredom: '😴',
                waiting: '⏰'
            };
            return emojis[trigger] || '💭';
        }

        // ============= STATE MANAGEMENT =============
        let state = {
            view: 'loading',
            user: null,
            plan: null,
            daily: null,
            dayNumber: 1,
            selectedTrigger: null,
            timerActive: false,
            timeLeft: 600,
            timerInterval: null,
            onboardingStep: 1,
            tempBaseline: 10,
            tempTriggers: []
        };

        function loadData() {
            const user = JSON.parse(localStorage.getItem('quitSmart_user') || 'null');
            const plan = JSON.parse(localStorage.getItem('quitSmart_plan') || 'null');
            
            if (!user || !user.onboardingComplete) {
                state.view = 'onboarding';
                render();
                return;
            }

            const today = getTodayString();
            const dayNum = getDayNumber(user.startDate);
            let daily = JSON.parse(localStorage.getItem(`quitSmart_daily_${today}`) || 'null');

            if (!daily && dayNum <= 21) {
                daily = {
                    date: today,
                    day: dayNum,
                    target: plan[dayNum - 1].target,
                    smoked: 0,
                    remaining: plan[dayNum - 1].target
                };
                localStorage.setItem(`quitSmart_daily_${today}`, JSON.stringify(daily));
            }

            state = { ...state, user, plan, daily, dayNumber: dayNum, view: 'dashboard' };
            render();
        }

        function saveUser(user) {
            localStorage.setItem('quitSmart_user', JSON.stringify(user));
            state.user = user;
        }

        function savePlan(plan) {
            localStorage.setItem('quitSmart_plan', JSON.stringify(plan));
            state.plan = plan;
        }

        function saveDaily(daily) {
            localStorage.setItem(`quitSmart_daily_${daily.date}`, JSON.stringify(daily));
            state.daily = daily;
        }

        // ============= EVENT HANDLERS =============
        function handleSmoked() {
            if (state.daily.remaining > 0) {
                state.daily.smoked++;
                state.daily.remaining--;
                saveDaily(state.daily);
                render();
            }
        }

        function completeOnboarding() {
            const user = {
                baseline: state.tempBaseline,
                triggers: state.tempTriggers,
                startDate: getTodayString(),
                onboardingComplete: true
            };
            saveUser(user);

            const plan = generatePlan(state.tempBaseline);
            savePlan(plan);

            const daily = {
                date: getTodayString(),
                day: 1,
                target: plan[0].target,
                smoked: 0,
                remaining: plan[0].target
            };
            saveDaily(daily);

            state = { ...state, user, plan, daily, dayNumber: 1, view: 'dashboard' };
            render();
        }

        function toggleTrigger(trigger) {
            if (state.tempTriggers.includes(trigger)) {
                state.tempTriggers = state.tempTriggers.filter(t => t !== trigger);
            } else if (state.tempTriggers.length < 3) {
                state.tempTriggers.push(trigger);
            }
            render();
        }

        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerActive = true;
            state.timeLeft = 600;
            render();
            
            state.timerInterval = setInterval(() => {
                if (state.timeLeft > 0 && state.timerActive) {
                    state.timeLeft--;
                    const timerDisplay = document.getElementById('timer-display');
                    if (timerDisplay) {
                        timerDisplay.textContent = formatTime(state.timeLeft);
                    }
                    if (state.timeLeft === 0) {
                        clearInterval(state.timerInterval);
                        state.timerActive = false;
                        render();
                    }
                } else {
                    clearInterval(state.timerInterval);
                }
            }, 1000);
        }

        function resetTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerActive = false;
            state.timeLeft = 600;
            render();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ============= RENDER FUNCTIONS =============
        function renderOnboarding() {
            if (state.onboardingStep === 1) {
                return `
                    <div class="max-w-md mx-auto p-4 pt-20">
                        <div class="bg-white rounded-2xl shadow-xl p-8">
                            <h1 class="text-4xl font-bold text-center mb-2 text-gray-800">QuitSmart</h1>
                            <p class="text-gray-600 text-center mb-8">Your 21-day journey starts here</p>
                            
                            <h2 class="text-xl font-semibold mb-4 text-gray-800">How many cigarettes per day?</h2>
                            <input type="range" min="1" max="60" value="${state.tempBaseline}" 
                                   oninput="state.tempBaseline = parseInt(this.value); render();"
                                   class="w-full h-3 bg-gray-200 rounded-lg mb-4 accent-indigo-600">
                            
                            <div class="text-center mb-8">
                                <div class="inline-block bg-indigo-50 rounded-2xl px-8 py-4">
                                    <span class="text-6xl font-bold text-indigo-600">${state.tempBaseline}</span>
                                    <span class="text-gray-600 ml-2 text-lg">per day</span>
                                </div>
                            </div>
                            
                            <button onclick="state.onboardingStep = 2; render();" 
                                    class="w-full bg-indigo-600 text-white py-4 rounded-lg font-semibold text-lg hover:bg-indigo-700 shadow-md">
                                Next →
                            </button>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="max-w-md mx-auto p-4 pt-20">
                        <div class="bg-white rounded-2xl shadow-xl p-8">
                            <h2 class="text-xl font-semibold mb-2 text-gray-800">Select your top 3 triggers</h2>
                            <p class="text-sm text-gray-600 mb-4">
                                <span class="inline-block bg-indigo-50 rounded-full px-4 py-1">
                                    <span class="font-semibold text-indigo-700">Selected: ${state.tempTriggers.length}/3</span>
                                </span>
                            </p>
                            
                            <div class="space-y-3 mb-6">
                                ${TRIGGERS.map(t => `
                                    <button onclick="toggleTrigger('${t}')"
                                            ${!state.tempTriggers.includes(t) && state.tempTriggers.length >= 3 ? 'disabled' : ''}
                                            class="w-full p-4 rounded-lg border-2 text-left font-medium flex items-center ${
                                                state.tempTriggers.includes(t) 
                                                    ? 'border-indigo-600 bg-indigo-50 text-indigo-700 shadow-md' 
                                                    : 'border-gray-200 hover:border-gray-300 text-gray-700'
                                            } disabled:opacity-40 disabled:cursor-not-allowed">
                                        <span class="text-2xl mr-3">${getTriggerEmoji(t)}</span>
                                        <span class="flex-1">${getLabel(t)}</span>
                                        ${state.tempTriggers.includes(t) ? '<span class="text-indigo-600">✓</span>' : ''}
                                    </button>
                                `).join('')}
                            </div>
                            
                            <div class="flex gap-3">
                                <button onclick="state.onboardingStep = 1; render();" 
                                        class="flex-1 bg-gray-200 text-gray-700 py-4 rounded-lg font-semibold hover:bg-gray-300">
                                    ← Back
                                </button>
                                <button onclick="completeOnboarding()" 
                                        ${state.tempTriggers.length !== 3 ? 'disabled' : ''}
                                        class="flex-1 bg-indigo-600 text-white py-4 rounded-lg font-semibold hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                                    Start Journey 🚀
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function renderDashboard() {
            if (state.dayNumber > 21) {
                return `
                    <div class="max-w-md mx-auto p-4 pt-20">
                        <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
                            <div class="text-6xl mb-4">🎉</div>
                            <h1 class="text-3xl font-bold text-green-600 mb-4">Congratulations!</h1>
                            <p class="text-gray-700 mb-6 text-lg">You've completed your 21-day journey! This is a huge achievement.</p>
                            <button onclick="localStorage.clear(); location.reload();" 
                                    class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700">
                                Start New Journey
                            </button>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="max-w-md mx-auto p-4 pt-8 pb-20">
                    <div class="bg-white rounded-2xl shadow-xl p-6 mb-4">
                        <div class="flex justify-between items-center mb-6">
                            <div>
                                <h1 class="text-2xl font-bold text-gray-800">QuitSmart</h1>
                                <p class="text-sm text-gray-600">Your reduction coach</p>
                            </div>
                            <button onclick="state.view = 'plan'; render();" class="text-indigo-600 text-sm font-medium hover:text-indigo-700">
                                View Plan →
                            </button>
                        </div>

                        <!-- Progress -->
                        <div class="mb-6">
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span class="font-semibold">Day ${state.dayNumber} of 21</span>
                                <span class="font-semibold">${Math.round((state.dayNumber / 21) * 100)}%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-3">
                                <div class="bg-gradient-to-r from-indigo-500 to-purple-600 h-3 rounded-full transition-all" style="width: ${(state.dayNumber / 21) * 100}%"></div>
                            </div>
                        </div>

                        <!-- Target -->
                        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl p-6 mb-6 text-white shadow-lg">
                            <h2 class="text-sm mb-2 opacity-90 font-semibold">Today's Target</h2>
                            <div class="flex justify-between items-end">
                                <div>
                                    <div class="text-6xl font-bold">${state.daily.target}</div>
                                    <p class="text-sm opacity-90">cigarettes allowed</p>
                                </div>
                                <div class="bg-white/20 backdrop-blur-sm rounded-lg px-4 py-2">
                                    <div class="text-2xl font-bold">${state.daily.remaining}</div>
                                    <div class="text-xs opacity-90">left today</div>
                                </div>
                            </div>
                        </div>

                        <!-- Stats -->
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-red-50 border-2 border-red-100 rounded-lg p-4">
                                <div class="text-3xl font-bold text-red-600">${state.daily.smoked}</div>
                                <div class="text-sm text-gray-600 mt-1">Smoked Today</div>
                            </div>
                            <div class="bg-green-50 border-2 border-green-100 rounded-lg p-4">
                                <div class="text-3xl font-bold text-green-600">${state.daily.remaining}</div>
                                <div class="text-sm text-gray-600 mt-1">Remaining</div>
                            </div>
                        </div>

                        <!-- Buttons -->
                        <button onclick="handleSmoked()" ${state.daily.remaining === 0 ? 'disabled' : ''}
                                class="w-full bg-red-500 text-white py-4 rounded-lg font-semibold text-lg mb-3 hover:bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed shadow-md">
                            🚬 Smoked 1
                        </button>
                        <button onclick="state.view = 'craving'; state.selectedTrigger = null; render();" 
                                class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-4 rounded-lg font-semibold text-lg hover:from-purple-600 hover:to-pink-600 shadow-md">
                            💭 Having a Craving?
                        </button>
                    </div>

                    <!-- Tip -->
                    <div class="bg-white rounded-xl shadow-md p-5 mb-4">
                        <div class="flex items-start">
                            <div class="flex-shrink-0 text-2xl mr-3">💡</div>
                            <div>
                                <h3 class="text-sm font-semibold text-gray-600 mb-2">Tip of the Day</h3>
                                <p class="text-gray-700">${state.plan[state.dayNumber - 1].tip}</p>
                            </div>
                        </div>
                    </div>

                    <div class="text-center text-xs text-gray-500 bg-white/50 rounded-lg p-3">
                        ⚠️ <strong>Disclaimer:</strong> Not medical advice. Consult a healthcare professional.
                    </div>
                </div>
            `;
        }

        function renderCraving() {
            if (!state.selectedTrigger) {
                return `
                    <div class="max-w-md mx-auto p-4 pt-8 pb-20">
                        <div class="bg-white rounded-2xl shadow-xl p-6">
                            <button onclick="state.view = 'dashboard'; render();" class="text-indigo-600 mb-4 font-medium hover:text-indigo-700">
                                ← Back to Dashboard
                            </button>
                            <div class="text-center mb-6">
                                <div class="text-6xl mb-4">💭</div>
                                <h1 class="text-2xl font-bold mb-2 text-gray-800">Craving Helper</h1>
                                <p class="text-gray-600">What's triggering your craving?</p>
                            </div>
                            <div class="space-y-3">
                                ${state.user.triggers.map(t => `
                                    <button onclick="state.selectedTrigger = '${t}'; render();"
                                            class="w-full p-5 rounded-lg border-2 border-gray-200 hover:border-purple-500 hover:bg-purple-50 text-left font-medium text-lg flex items-center group shadow-sm hover:shadow-md transition">
                                        <span class="text-3xl mr-4">${getTriggerEmoji(t)}</span>
                                        <span class="flex-1">${getLabel(t)}</span>
                                        <span class="text-gray-400 group-hover:text-purple-500">→</span>
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            const alts = ALTERNATIVES[state.selectedTrigger];
            return `
                <div class="max-w-md mx-auto p-4 pt-8 pb-20">
                    <div class="bg-white rounded-2xl shadow-xl p-6">
                        <button onclick="state.selectedTrigger = null; resetTimer(); render();" class="text-indigo-600 mb-4 font-medium hover:text-indigo-700">
                            ← Choose different trigger
                        </button>
                        
                        <div class="text-center mb-6">
                            <div class="text-5xl mb-3">${getTriggerEmoji(state.selectedTrigger)}</div>
                            <h2 class="text-xl font-semibold text-gray-800 mb-1">${getLabel(state.selectedTrigger)}</h2>
                            <p class="text-sm text-gray-600">Try these alternatives:</p>
                        </div>

                        <div class="space-y-3 mb-6">
                            ${alts.map(alt => `
                                <div class="bg-gradient-to-r from-purple-50 to-pink-50 p-4 rounded-lg border-2 border-purple-200">
                                    <div class="flex items-start">
                                        <span class="text-2xl mr-3">✓</span>
                                        <div class="flex-1">
                                            <p class="font-medium text-gray-800 mb-1">${alt.action}</p>
                                            <p class="text-sm text-gray-600 flex items-center">
                                                <span class="mr-1">⏱️</span>
                                                ${alt.duration}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Timer -->
                        <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl p-6 text-center text-white shadow-lg">
                            <h3 class="text-sm mb-3 opacity-90 font-semibold">10-Minute Delay Timer</h3>
                            <div id="timer-display" class="text-7xl font-bold mb-4 font-mono">${formatTime(state.timeLeft)}</div>
                            <p class="text-sm mb-4 opacity-90">${state.timerActive ? 'Timer is running...' : 'Delay your next cigarette'}</p>
                            ${!state.timerActive ? `
                                <button onclick="startTimer()" class="bg-white text-indigo-600 px-8 py-3 rounded-lg font-semibold hover:bg-gray-100 shadow-md">
                                    Start Timer
                                </button>
                            ` : `
                                <button onclick="resetTimer()" class="bg-white/20 backdrop-blur-sm text-white px-8 py-3 rounded-lg font-semibold hover:bg-white/30">
                                    Reset
                                </button>
                            `}
                            ${state.timeLeft === 0 ? `
                                <div class="mt-4 bg-white/20 backdrop-blur-sm rounded-lg p-3">
                                    <p class="font-semibold">✅ Great job!</p>
                                    <p class="text-sm opacity-90 mt-1">10 minutes passed. Your craving should be weaker now.</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPlan() {
            return `
                <div class="max-w-2xl mx-auto p-4 pt-8 pb-20">
                    <div class="bg-white rounded-2xl shadow-xl p-6">
                        <button onclick="state.view = 'dashboard'; render();" class="text-indigo-600 mb-4 font-medium hover:text-indigo-700">
                            ← Back to Dashboard
                        </button>
                        <h1 class="text-2xl font-bold mb-6 text-gray-800">Your 21-Day Plan</h1>
                        
                        <div class="space-y-3">
                            ${state.plan.map(day => `
                                <div class="p-4 rounded-lg border-2 ${
                                    day.day === state.dayNumber ? 'border-indigo-600 bg-indigo-50 shadow-md' :
                                    day.day < state.dayNumber ? 'border-green-300 bg-green-50' :
                                    'border-gray-200 bg-gray-50'
                                }">
                                    <div class="flex items-start justify-between mb-2">
                                        <div class="flex items-center">
                                            <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm mr-3 ${
                                                day.day === state.dayNumber ? 'bg-indigo-600 text-white' :
                                                day.day < state.dayNumber ? 'bg-green-500 text-white' :
                                                'bg-gray-300 text-gray-600'
                                            }">
                                                ${day.day}
                                            </div>
                                            <div>
                                                <span class="font-bold text-gray-800">Day ${day.day}</span>
                                                ${day.day === state.dayNumber ? '<span class="ml-2 text-xs bg-indigo-600 text-white px-2 py-1 rounded-full">Today</span>' : ''}
                                                ${day.day < state.dayNumber ? '<span class="ml-2 text-xs bg-green-600 text-white px-2 py-1 rounded-full">✓ Done</span>' : ''}
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <div class="text-3xl font-bold text-indigo-600">${day.target}</div>
                                            <div class="text-xs text-gray-600">cigarettes</div>
                                        </div>
                                    </div>
                                    <div class="flex items-start mt-3 pt-3 border-t border-gray-200">
                                        <span class="text-lg mr-2">💡</span>
                                        <p class="text-sm text-gray-700 flex-1">${day.tip}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function render() {
            const app = document.getElementById('app');
            
            switch (state.view) {
                case 'loading':
                    app.innerHTML = '<div class="flex items-center justify-center min-h-screen"><div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div></div>';
                    break;
                case 'onboarding':
                    app.innerHTML = renderOnboarding();
                    break;
                case 'dashboard':
                    app.innerHTML = renderDashboard();
                    break;
                case 'craving':
                    app.innerHTML = renderCraving();
                    break;
                case 'plan':
                    app.innerHTML = renderPlan();
                    break;
            }
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
